name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Granted per job instead: only the release job needs write access.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to sign the build provenance attestation.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # macOS support is Apple Silicon only.
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BINARY="fgm"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="fgm.exe"
          fi

          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/m-amaresh/fgm/internal/cli.Version=${VERSION} \
              -X github.com/m-amaresh/fgm/internal/cli.Commit=${COMMIT} \
              -X github.com/m-amaresh/fgm/internal/cli.Date=${DATE}" \
            -o "$BINARY" \
            ./cmd/fgm

          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="fgm_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            zip "$ARCHIVE" "$BINARY"
          else
            ARCHIVE="fgm_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
            tar -czf "$ARCHIVE" "$BINARY"
          fi

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Generate checksum
        run: sha256sum "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"

      # Signed, verifiable provenance for each archive. The checksums file is
      # produced by this same workflow, so it cannot vouch for itself;
      # attestation gives an independent chain back to this build.
      # Verify with: gh attestation verify <archive> --repo m-amaresh/fgm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.ARCHIVE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fgm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
